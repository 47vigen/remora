version: "2"
run:
  timeout: 5m
  build-tags: [e2e]
linters:
  exclusions:
    paths: [engines/]
  default: standard
  enable: [bodyclose, contextcheck, errorlint, gocritic, gosec, misspell, noctx, revive, sloglint, unconvert, usestdlibvars]
formatters:
  enable: [gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/47vigen/remora]
  exclusions:
    paths: [engines/]
