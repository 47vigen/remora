name: govulncheck

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # A reachable vulnerability fails the job.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
