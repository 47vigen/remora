name: release

# A release-please tag (pushed by the bot App) starts this workflow. Each
# architecture is built natively on its own runner and pushed by digest only;
# both digests then run the README quick start and the e2e suite; only then are
# the semver and latest tags written, the index signed, and the GitHub release
# annotated. A red leg on either architecture moves no tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, test and publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/47vigen/remora

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
      - name: Export build versions
        run: |
          cat engines/versions.env >> "$GITHUB_ENV"
          echo "REMORA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            REMORA_VERSION=${{ env.TAG }}
            REMORA_COMMIT=${{ env.REMORA_COMMIT }}
            BIFROST_VERSION=${{ env.BIFROST_VERSION }}
            CLIPROXYAPI_VERSION=${{ env.CLIPROXYAPI_VERSION }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
      - name: Image under test
        run: echo "REF=${IMAGE}@$(cat "$RUNNER_TEMP/digests/${{ matrix.arch }}")" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull
        run: docker pull "$REF"
      - name: Check the version
        run: |
          out="$(docker run --rm "$REF" version)"
          echo "$out"
          grep -qF -- "$TAG" <<<"$out"
      - name: Build fakes image
        run: docker build -f test/fakes/Dockerfile -t remora-fakes:dev .
      - name: README quick start
        env:
          FAKES_IMAGE: remora-fakes:dev
        run: REMORA_IMAGE="$REF" scripts/quickstart-smoke.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: e2e suite
        env:
          FAKES_IMAGE: remora-fakes:dev
        run: REMORA_IMAGE="$REF" go test -tags e2e -count=1 -timeout 45m ./test/e2e/...

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Prerelease tags (vX.Y.Z-rc.N) never move X.Y or latest.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ !contains(env.TAG, '-') }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          flavor: latest=false
      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          for arch in amd64 arm64; do args+=("${IMAGE}@$(cat "$arch")"); done
          docker buildx imagetools create "${args[@]}"
      - name: Read the index digest
        id: index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github\.com/47vigen/remora/\.github/workflows/release\.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  notes:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read engine versions from the image
        run: |
          id="$(docker create --platform linux/amd64 "${IMAGE}@${DIGEST}")"
          docker cp "$id:/usr/local/lib/remora/engines/versions.json" versions.json
          docker rm "$id"
          cat versions.json
      - name: Export SBOMs
        run: |
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
              --format "{{ json (index .SBOM \"linux/${arch}\").SPDX }}" > "sbom-linux-${arch}.spdx.json"
            jq -e . "sbom-linux-${arch}.spdx.json" > /dev/null
          done
      - name: Annotate the release
        run: |
          scripts/release-notes.sh versions.json "$IMAGE" "$DIGEST" > assets.md
          if body="$(gh release view "$TAG" --json body -q .body)"; then
            # Cut a previous block so re-runs stay idempotent.
            awk '/^<!-- remora-release-assets -->$/ { exit } { print }' <<<"$body" > notes.md
            cat assets.md >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          else
            # No release yet (a hand-pushed tag): create it.
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file assets.md "${prerelease[@]}"
          fi
      - name: Attach SBOMs
        run: gh release upload "$TAG" sbom-linux-amd64.spdx.json sbom-linux-arm64.spdx.json --clobber
