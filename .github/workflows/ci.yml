name: ci

on:
  pull_request:
  push:
    branches: [main]
    # A release merge changes only these, and release.yml tests the tagged image on both architectures.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json

permissions: {}

# Only a newer push to the same pull request cancels a run; every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A release pull request changes only the changelog and the version manifest, and release.yml builds and tests
# the tagged image on both architectures, so its jobs are skipped; a skipped required check counts as passed. Only a
# pull request the release bot opened from this repository is exempt, never a branch that merely has the name.
jobs:
  lint:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'remora-bot-47vigen[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'remora-bot-47vigen[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: OpenAPI generation drift
        run: go generate ./internal/api/gen && git diff --exit-code -- internal/api/gen
      - run: go test -race ./...

  engine:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'remora-bot-47vigen[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            engines/cliproxyapi/go.sum
      - name: Export engine versions
        run: cat engines/versions.env >> "$GITHUB_ENV"
      # Built exactly as the Dockerfile's cliproxyapi stage builds it (cgo, on the runner).
      - name: Build the OAuth engine
        working-directory: engines/cliproxyapi
        run: CGO_ENABLED=1 go build -buildvcs=false -trimpath -ldflags "-X main.Version=$CLIPROXYAPI_VERSION" -o "$RUNNER_TEMP/cliproxyapi" ./cmd/server
      - name: Engine contract tests
        run: REMORA_CLIPROXYAPI_BIN="$RUNNER_TEMP/cliproxyapi" go test -race -tags engine ./internal/engine/cliproxyapi/ ./internal/quota/

  web:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'remora-bot-47vigen[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bun install --frozen-lockfile
      - name: OpenAPI client drift
        run: bun run gen && git diff --exit-code -- src/client
      - run: bun run lint && bun run format:check
      - name: Build and route tree drift
        run: bun run build && git diff --exit-code -- src/routeTree.gen.ts
      - run: bun run typecheck && bun run test
      - name: Embedded console
        working-directory: .
        run: go test -tags webdist ./internal/web/

  image:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'remora-bot-47vigen[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check engine pins
        run: scripts/check-engine-pins.sh
      - name: Export build versions
        run: |
          {
            cat engines/versions.env
            echo "REMORA_VERSION=$(git describe --tags --always --dirty)"
            echo "REMORA_COMMIT=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build remora image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: remora:dev
          build-args: |
            BIFROST_VERSION=${{ env.BIFROST_VERSION }}
            CLIPROXYAPI_VERSION=${{ env.CLIPROXYAPI_VERSION }}
            REMORA_VERSION=${{ env.REMORA_VERSION }}
            REMORA_COMMIT=${{ env.REMORA_COMMIT }}
          cache-from: type=gha,scope=remora
          cache-to: type=gha,mode=max,scope=remora
      - name: Build fakes image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/fakes/Dockerfile
          platforms: linux/amd64
          load: true
          tags: remora-fakes:dev
          cache-from: type=gha,scope=fakes
          cache-to: type=gha,mode=max,scope=fakes
      - name: Save images
        run: docker save remora:dev remora-fakes:dev -o images.tar
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar
          retention-days: 1

  e2e:
    permissions:
      contents: read
    needs: image
    runs-on: ubuntu-latest
    env:
      REMORA_IMAGE: remora:dev
      FAKES_IMAGE: remora-fakes:dev
      # Keep the stack after the suite so a failure can collect its logs below.
      REMORA_E2E_KEEP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: images
      - name: Load images
        run: docker load -i images.tar
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run e2e suite
        run: make e2e
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Console smoke tests
        working-directory: web
        env:
          # A fixed test value that compose.yaml sets; never a real secret.
          REMORA_ADMIN_PASSWORD: e2e-admin-password
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          # compose.yaml publishes remora on an ephemeral host port; REMORA_E2E_KEEP left the stack up.
          REMORA_URL="http://$(docker compose -f ../test/e2e/compose.yaml -p remora-e2e port remora 8080)"
          export REMORA_URL
          bun run e2e
      - name: Collect compose logs
        if: failure()
        run: docker compose -f test/e2e/compose.yaml -p remora-e2e logs --no-color > e2e-compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-compose-logs
          path: e2e-compose.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test-results
          path: web/test-results
          if-no-files-found: ignore

  # The README quick start, run verbatim against the fakes on a fresh runner with only Docker.
  quickstart:
    permissions:
      contents: read
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: images
      - name: Load images
        run: docker load -i images.tar
      - name: README quick start
        run: REMORA_IMAGE=remora:dev FAKES_IMAGE=remora-fakes:dev scripts/quickstart-smoke.sh
      - name: Compose example
        run: REMORA_ADMIN_PASSWORD=x docker compose -f deploy/compose.yaml config -q

  actionlint:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'remora-bot-47vigen[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
