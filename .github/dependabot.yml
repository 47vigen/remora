# Weekly, one grouped pull request per ecosystem for minor and patch updates.
# No gitsubmodule entry: the engine bump workflow owns engines/, and the
# engines' own go.mod files are upstream's.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      all:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      all:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      all:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      all:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The OpenAPI client generator needs the TypeScript 6 compiler API; type checking already runs TypeScript 7
      # through the `typescript-7` alias (docs/plans/2026-10-14-06-web-ui.md, Corrections).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
