services:
  fakes:
    image: ${FAKES_IMAGE:-remora-fakes:dev}
    ports: ["127.0.0.1::9090"]
  remora:
    image: ${REMORA_IMAGE:-remora:dev}
    environment:
      REMORA_ADMIN_PASSWORD: e2e-admin-password
      # Test values only; testdata/remora.yaml reads them through env: references.
      E2E_UPSTREAM_KEY: e2e-upstream-key
      E2E_KEY_FULL: rk-e2e-full-key
      E2E_KEY_LIMITED: rk-e2e-limited-key
      E2E_KEY_OFF: rk-e2e-off-key
      E2E_SONIOX_KEY: fake-soniox-key
      E2E_KEY_SPEECH: rk-e2e-speech-key
      # The speech adapter talks to the Soniox fake; short intervals keep the long-job and sweep tests fast.
      REMORA_SONIOX_BASE_URL: http://fakes:9090/u/sx
      REMORA_SONIOX_POLL_INTERVAL: 500ms
      REMORA_SONIOX_SWEEP_INTERVAL: 2s
    volumes:
      - ./testdata:/e2e:ro
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::18080"   # published on purpose: proves the engines are bound to loopback
      - "127.0.0.1::18317"
    depends_on: [fakes]
