services:
  fakes:
    image: ${FAKES_IMAGE:-remora-fakes:dev}
    ports: ["127.0.0.1::9090"]
  remora:
    image: ${REMORA_IMAGE:-remora:dev}
    environment:
      REMORA_ADMIN_PASSWORD: e2e-admin-password
      # Test values only; testdata/remora.yaml reads them through env: references.
      E2E_UPSTREAM_KEY: e2e-upstream-key
      E2E_KEY_FULL: rk-e2e-full-key
      E2E_KEY_LIMITED: rk-e2e-limited-key
      E2E_KEY_OFF: rk-e2e-off-key
      E2E_SONIOX_KEY: fake-soniox-key
      E2E_KEY_SPEECH: rk-e2e-speech-key
      # The speech adapter talks to the Soniox fake; short intervals keep the long-job and sweep tests fast.
      REMORA_SONIOX_BASE_URL: http://fakes:9090/u/sx
      REMORA_SONIOX_POLL_INTERVAL: 500ms
      REMORA_SONIOX_SWEEP_INTERVAL: 2s
      E2E_KEY_COOL: rk-e2e-cool-key
      # Cooling: read the front door's log every second; a failure without a retry hint cools for 1s, so a test
      # that cools a member on purpose gets it back quickly; 429s never cool here (the threshold is unit-tested),
      # so the fallback tests' scripted 429s leave their members in their chains.
      REMORA_COOLING_POLL: 1s
      REMORA_COOLING_DEFAULT: 1s
      REMORA_COOLING_429_COUNT: "1000"
      # Quota checks go to the fakes through the real engine; no background polling keeps runs deterministic.
      REMORA_QUOTA_BASE_URL: http://fakes:9090/u/quota
      REMORA_QUOTA_INTERVAL: "0"
    # Whatever the engine does on its own with a fixture token (a model probe, a token refresh) is refused locally
    # and never reaches a provider.
    extra_hosts:
      - "daily-cloudcode-pa.googleapis.com:127.0.0.1"
      - "cloudcode-pa.googleapis.com:127.0.0.1"
      - "oauth2.googleapis.com:127.0.0.1"
      - "chatgpt.com:127.0.0.1"
      - "auth.openai.com:127.0.0.1"
      - "api.anthropic.com:127.0.0.1"
      - "platform.claude.com:127.0.0.1"
      - "antigravity-hub-auto-updater-974169037036.us-central1.run.app:127.0.0.1"
    volumes:
      - ./testdata:/e2e:ro
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::18080"   # published on purpose: proves the engines are bound to loopback
      - "127.0.0.1::18317"
    depends_on: [fakes]
