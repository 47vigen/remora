services:
  remora:
    image: ghcr.io/47vigen/remora:latest
    ports: ["8080:8080"]
    environment:
      REMORA_ADMIN_PASSWORD: ${REMORA_ADMIN_PASSWORD:?set REMORA_ADMIN_PASSWORD}
      REMORA_DRAIN_TIMEOUT: 5s
    volumes: ["remora-data:/data"]
    restart: unless-stopped
    # Recommended memory limit; see the Memory section in README.md.
    # mem_limit: 2g
    # memswap_limit: 2g
    # Keep at least 5s more than REMORA_DRAIN_TIMEOUT for shutdown cleanup and nginx.
    stop_grace_period: 10s
volumes:
  remora-data: {}
