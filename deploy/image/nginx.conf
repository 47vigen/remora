# nginx in front of remora inside its image: it serves the console from disk with the .br and .gz files the web build
# wrote beside each asset, and proxies /api, /v1, /mcp and /healthz to remora on loopback.
include /etc/nginx/modules-enabled/*.conf;
worker_processes auto;
worker_rlimit_nofile 65536;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 10000;
    reset_timedout_connection on;

    # The console never changes inside a running image.
    open_file_cache max=2000 inactive=1h;
    open_file_cache_valid 1h;
    open_file_cache_errors on;

    brotli_static on;
    gzip_static on;
    # API answers are compressed on the fly; text/event-stream is left out so a stream is never held back.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream remora {
        server 127.0.0.1:8081;
        keepalive 64;
    }

    server {
        listen 8080 default_server reuseport;
        root /usr/share/remora/web;
        client_max_body_size 0;
        add_header X-Content-Type-Options nosniff always;

        location ~ ^/(api|v1)(/|$) {
            proxy_pass http://remora;
            include /etc/remora/proxy.conf;
        }
        location = /mcp {
            proxy_pass http://remora;
            include /etc/remora/proxy.conf;
        }
        location = /healthz {
            proxy_pass http://remora;
            include /etc/remora/proxy.conf;
        }

        # Hashed by the build, so a name never changes content.
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
        # A missing file is a 404; any other path is a client-side route and gets the index.
        location ~ \.[A-Za-z0-9]+$ {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
